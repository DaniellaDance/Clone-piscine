<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><title>Modus Centre</title><style>
:root{font:15px/1.45 system-ui,Arial;color:#243044;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px}header{background:white;border-bottom:1px solid #dfe4ea;padding:16px 4%;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}.logo{font-size:23px;font-weight:850;color:#a51e32}.logo small{display:block;color:#667788;font-size:10px;letter-spacing:2px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100dvh - 76px)}nav{background:#fff;padding:18px;border-right:1px solid #dfe4ea;display:grid;align-content:start;gap:8px}nav button{text-align:left;background:transparent;color:#3d4b5b}nav button.active{background:#fcebee;color:#a51e32;font-weight:700}main{padding:25px;max-width:1400px;width:100%;margin:auto}h1{font-size:26px;margin:0 0 6px}h2{font-size:17px}.muted{color:#748093}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.kpi,.panel{background:white;border:1px solid #e0e5eb;border-radius:14px;padding:18px}.kpi strong{display:block;font-size:30px}.kpi span{font-size:12px;color:#6c7a89}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.primary{background:#aa2135;color:#fff}.soft{background:#e9eef4;color:#36495b}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{background:#f0f3f6}.filters button.sel{background:#243c55;color:white}.ticket{display:grid;grid-template-columns:minmax(0,1fr) 120px 140px;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #edf0f3;cursor:pointer}.ticket:last-child{border-bottom:0}.ticket b{display:block}.ticket small{display:block;color:#6b7b8b;margin-top:4px}.pill{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}.new{background:#ffe1e5;color:#b01e33}.work{background:#fff2c9;color:#8b6000}.resolved{background:#daf5e3;color:#217545}.urg{color:#c41f32;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select{border:1px solid #cbd4de;border-radius:8px;padding:10px;background:white;width:100%}.field textarea{min-height:90px}.dialog{position:fixed;inset:0;background:#1b28365c;display:grid;place-items:center;padding:12px;z-index:9}.dialog .panel{width:min(650px,100%);max-height:92dvh;overflow:auto}.step{position:relative;padding:0 0 18px 27px;border-left:2px solid #dbe2e9;margin-left:7px}.step:before{content:'●';position:absolute;left:-8px;top:-2px;color:#a51e32}.step small{display:block;color:#68798b}.notify{position:fixed;right:15px;top:85px;max-width:340px;background:white;box-shadow:0 8px 35px #28394940;border-left:5px solid #aa2135;padding:16px;z-index:8;border-radius:10px}.bars{display:grid;gap:12px}.bar{height:12px;background:#edf0f3;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#ad293b}.foot{font-size:12px;color:#7b8795;margin-top:18px}@media(max-width:760px){.shell{display:block}nav{display:flex;overflow:auto;border:0;padding:8px;gap:4px}nav button{white-space:nowrap;font-size:12px;padding:8px}main{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.ticket{grid-template-columns:1fr 90px;gap:6px}.ticket>small{grid-column:1/-1}.notify{top:65px;right:8px;left:8px;max-width:none}}
html,body{width:100%;max-width:100%;overflow-x:hidden}
.shell{height:calc(100dvh - 78px);min-height:0;overflow:hidden}
.shell main{min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain}
.shell nav{min-height:0;overflow-y:auto}
main .panel,.ticket{min-width:0}
.ticket b,.ticket small{overflow-wrap:anywhere}
.kpis{margin:10px 0;gap:8px}.kpi{padding:10px}.kpi strong{font-size:clamp(18px,3vw,27px)}
.panel{padding:clamp(10px,2vw,16px)}main{padding:clamp(10px,2vw,18px)}
.dialog .panel{width:min(650px,calc(100vw - 20px));max-height:calc(100dvh - 24px);overflow-y:auto}
.mobile-menu{display:none}
@media(max-width:760px){
header{padding:8px 12px;min-height:62px;gap:6px;flex-wrap:nowrap}
header .logo{font-size:clamp(14px,4vw,20px);line-height:1.1}
header .logo small{font-size:8px;letter-spacing:.4px}
header>.row{gap:4px;min-width:0}
header #identity{font-size:10px;max-width:35vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header #sound{font-size:10px;padding:7px}
.mobile-menu{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:7px 10px;background:#e9eef4;color:#243c55;font-size:19px}
.shell{display:block;height:calc(100dvh - 62px)}
.shell main{height:100%;padding:10px}
.shell nav{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(290px,84vw);display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:70px 15px 20px;background:#fff;box-shadow:8px 0 40px #172a3e45;transform:translateX(-110%);transition:transform .2s ease;overflow-y:auto}
body.menu-open .shell nav{transform:translateX(0)}
body.menu-open:before{content:'';position:fixed;inset:0;background:#172a3e85;z-index:29}
.shell nav button{font-size:15px;text-align:left;padding:13px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.kpi{padding:8px 4px;text-align:center}.kpi span{font-size:10px}.kpi strong{font-size:19px}
.ticket{grid-template-columns:minmax(0,1fr) auto;gap:5px;padding:10px 0}
.ticket>small{display:none}.ticket .pill{font-size:10px;padding:4px 7px}
.filters{gap:4px}.filters button{padding:7px 9px;font-size:12px}
.row{gap:6px}.row button{padding:8px}
}
@media(max-width:370px){header #sound{display:none}.kpi span{font-size:9px}.kpi strong{font-size:16px}}
</style></head><body><header><button id="menuToggle" class="mobile-menu" type="button" aria-label="Открыть меню" aria-expanded="false">☰</button><div class="logo">MODUS <span style="color:#29394b">TRADE CENTRE</span><small>НАША ЭКСПЕРТИЗА — ВАША БЕЗОПАСНОСТЬ</small></div><div class="row"><span id="identity" class="muted">Демо-режим</span><button class="soft" id="sound">🔕 Включить звук</button></div></header><div class="shell"><nav id="nav"></nav><main id="main"></main></div><div id="overlay"></div><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=x=>new Date(x).toLocaleString('ru-RU'),age=x=>{let m=Math.max(0,Math.floor((Date.now()-new Date(x))/60000));return m<1?'только что':m<60?m+' мин':m<1440?Math.floor(m/60)+' ч '+m%60+' мин':Math.floor(m/1440)+' д'},names={new:'Новая',work:'В работе',resolved:'Решена'},roles={client:'Клиент',staff:'Сотрудник',manager:'Руководитель отдела',director:'Директор'};
let user=null,data=[],tab='Главная',filter='all',seen=null,stream=null,sound=false,ctx=null;
const menu=['Главная','Все заявки','Подать заявку','Идеи','Аналитика','База знаний'];
async function api(path,options){let r=await fetch(path,{cache:'no-store',...options});let v=await r.json();if(!r.ok)throw Error(v.error||'Ошибка сервера');return v}
function ring(){if(!sound||!ctx)return;[660,880].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),at=ctx.currentTime+i*.18;o.frequency.value=f;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.1,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.14);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+.15)})}
$('sound').onclick=async()=>{if(sound){sound=false;$('sound').textContent='🔕 Включить звук';return}try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();sound=true;$('sound').textContent='🔔 Звук включён'}catch{alert('Звук недоступен')}};
async function loginPage(){let options=await api('/api/demo-users');$('nav').innerHTML='';$('identity').textContent='Демонстрационная версия';$('main').innerHTML='<div class="panel" style="max-width:520px;margin:5vh auto"><div class="logo">MODUS CENTRE</div><h1>Добро пожаловать</h1><p class="muted">Выберите демонстрационный личный кабинет. Все пользователи и заявки вымышлены.</p><form id="login"><label class="field">Тип кабинета<select id="who">'+options.map(u=>'<option value="'+esc(u.id)+'">'+esc(roles[u.role])+' — '+esc(u.name)+' · '+esc(u.organization)+'</option>').join('')+'</select></label><label class="field">Пароль<input id="loginPassword" type="password" required minlength="3" autocomplete="current-password" placeholder="Пароль демонстрационной учётной записи"></label><button class="primary" style="width:100%">Войти в демо-кабинет</button></form><p class="foot">Для входа необходим индивидуальный пароль. Демо-данные вымышлены.</p></div>';$('login').onsubmit=async e=>{e.preventDefault();try{let v=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:$('who').value,password:$('loginPassword').value})});user=v.user;seen=null;connect();await load()}catch(e){alert(e.message)}}}
async function start(){try{user=await api('/api/me');connect();await load()}catch{await loginPage()}}
function connect(){if(stream)stream.close();stream=new EventSource('/api/events');stream.addEventListener('change',load)}
async function load(){if(!user)return;try{let next=await api('/api/tickets');if(seen){let fresh=next.filter(t=>!seen.has(t.id));if(fresh.length){ring();$('overlay').innerHTML='<div class="notify"><b>🔔 Новая заявка</b><p>'+esc(fresh[0].title)+'</p><button class="primary" id="notification-open">Открыть</button></div>';$('notification-open').onclick=()=>openTicket(fresh[0].id);setTimeout(()=>{if($('overlay').querySelector('.notify'))$('overlay').innerHTML=''},10000)}}seen=new Set(next.map(t=>t.id));data=next;render()}catch(e){if(e.message.includes('вход')){user=null;await loginPage()}}}
function nav(t){tab=t;document.body.classList.remove('menu-open');$('menuToggle').setAttribute('aria-expanded','false');render()}
function render(){if(!user)return;$('identity').innerHTML=esc(user.name)+' · '+esc(roles[user.role])+' <button class="soft" id="logout">Выйти</button>';$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});if(stream)stream.close();user=null;data=[];seen=null;$('overlay').innerHTML='';await loginPage()};$('nav').innerHTML=menu.filter(m=>m!=='Аналитика'||user.role==='director'||user.role==='manager').map(m=>'<button class="'+(tab===m?'active':'')+'" data-tab="'+m+'">'+m+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));let total=data.length,n=data.filter(t=>t.status==='new').length,w=data.filter(t=>t.status==='work').length,r=data.filter(t=>t.status==='resolved').length;let list=data.filter(t=>(filter==='all'||t.status===filter)&&(tab!=='Идеи'||t.type==='Идея')).sort((a,b)=>new Date(b.created)-new Date(a.created));let rows=list.map(t=>'<div class="ticket" data-id="'+esc(t.id)+'"><div><b>'+(t.priority==='urgent'?'<span class="urg">! </span>':'')+esc(t.title)+'</b><small>'+esc(t.department)+' · '+esc(t.author)+' · '+age(t.created)+'</small></div><span class="pill '+t.status+'">'+names[t.status]+'</span><small>'+date(t.created)+'</small></div>').join('')||'<p class="muted">Заявок пока нет</p>';let kpis='<div class="kpis">'+[['Всего',total],['Новые',n],['В работе',w],['Решены',r]].map(x=>'<div class="kpi"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div>';let filters='<div class="filters">'+[['all','Все'],['new','Новые'],['work','В работе'],['resolved','Решены']].map(x=>'<button data-filter="'+x[0]+'" class="'+(filter===x[0]?'sel':'')+'">'+x[1]+'</button>').join('')+'</div>';let form='<div class="panel"><h2>Новое обращение или идея</h2><form id="create"><label class="field">Тип<select name="type"><option>Сервисная заявка</option><option>Идея</option><option>Поставка</option><option>Гарантия</option><option>Внутренняя заявка</option></select></label><label class="field">Отдел<select name="department"><option>Сервисный центр</option><option>Логистика</option><option>Продажи</option><option>ИТ и интеграции</option><option>Развитие и качество</option></select></label><label class="field">Тема<input name="title" required maxlength="140"></label><label class="field">Описание<textarea name="description" required maxlength="3000"></textarea></label><label><input type="checkbox" name="urgent"> Срочно</label><p><button class="primary">Отправить</button></p></form></div>';let analytics='<div class="panel"><h2>Аналитика по доступным заявкам</h2><div class="bars">'+[['Новые',n],['В работе',w],['Решены',r]].map(x=>'<div>'+x[0]+' · '+x[1]+'<div class="bar"><i style="width:'+(total?x[1]/total*100:0)+'%"></i></div></div>').join('')+'</div></div>';let kb='<div class="panel"><h2>База знаний</h2><p>Видеонаблюдение: проверьте PoE-питание, сеть и журнал регистратора.</p><p>СКУД: проверьте контроллер и журнал событий.</p><p>Гарантия: укажите модель оборудования и номер заказа.</p></div>';createFormHTML=form;let body=kpis+'<div class="panel"><div class="row" style="justify-content:space-between"><h2>Реестр обращений</h2><button class="primary" id="new">+ Создать заявку</button></div>'+filters+rows+'</div>'+(user.role==='director'||user.role==='manager'?analytics:'')+kb;$('main').innerHTML='<h1>'+esc(tab)+'</h1><p class="muted">'+esc(user.organization)+' · '+esc(roles[user.role])+' · Центр заявок и идей</p>'+body+'<p class="foot">Modus Centre · ДЕМО · Вымышленные пользователи и обращения</p>';document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openTicket(b.dataset.id));if($('new'))$('new').onclick=()=>openCreate();if($('create'))$('create').onsubmit=submit}
let createFormHTML='';
function openCreate(){$('overlay').innerHTML='<div class="dialog"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Новая заявка</h2><button class="soft" id="closeCreate" type="button">✕</button></div>'+createFormHTML+'</div></div>';$('closeCreate').onclick=()=>{$('overlay').innerHTML=''};$('create').onsubmit=submit}
async function submit(e){e.preventDefault();let f=new FormData(e.target),b=Object.fromEntries(f);b.priority=f.has('urgent')?'urgent':'normal';delete b.urgent;try{let x=await api('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});tab='Главная';$('overlay').innerHTML='';await load();openTicket(x.id)}catch(e){alert(e.message)}}
function openTicket(id){let t=data.find(x=>x.id===id);if(!t)return;let h=[{at:t.created,by:t.author,label:'Заявка получена',detail:t.description},...(t.history||[])].sort((a,b)=>new Date(a.at)-new Date(b.at));let canEdit=user.role==='director'||user.role==='manager'||user.role==='staff'&&user.department===t.department;$('overlay').innerHTML='<div class="dialog"><div class="panel"><div class="row" style="justify-content:space-between"><h2>'+esc(t.title)+'</h2><button class="soft" id="close">✕</button></div><span class="pill '+t.status+'">'+names[t.status]+'</span><p>'+esc(t.description)+'</p><h2>История обработки · как отслеживание посылки</h2>'+h.map(x=>'<div class="step"><b>'+esc(x.label)+'</b><small>'+date(x.at)+' · '+esc(x.by)+'</small><p>'+esc(x.detail||'')+'</p></div>').join('')+(canEdit?'<form id="update"><label class="field">Ответ / результат<textarea name="detail" required></textarea></label><label class="field">Кому адресовано сообщение<select name="audience"><option value="internal">Только сотрудникам — внутренняя переписка</option><option value="client">Клиенту — показать сообщение клиенту</option></select></label><label class="field">Этап<select name="status"><option value="work">В работе</option><option value="resolved">Решена</option><option value="new">Новая</option></select></label><button class="primary">Сохранить ответ</button></form>':'<p class="muted">Клиент видит этапы рассмотрения и только адресованные ему сообщения.</p>')+'</div></div>';$('close').onclick=()=>{$('overlay').innerHTML=''};if($('update'))$('update').onsubmit=async e=>{e.preventDefault();try{await api('/api/tickets/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load();openTicket(id)}catch(e){alert(e.message)}}}
$('menuToggle').addEventListener('click',()=>{let open=document.body.classList.toggle('menu-open');$('menuToggle').setAttribute('aria-expanded',String(open))});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('menu-open')});start();setInterval(()=>{if(user&&(!stream||stream.readyState!==1))load()},6000);
</script></body></html>
