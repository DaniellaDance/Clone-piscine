<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><title>Modus Centre</title><style>
:root{font:15px/1.45 system-ui,Arial;color:#243044;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px}header{background:white;border-bottom:1px solid #dfe4ea;padding:16px 4%;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}.logo{font-size:23px;font-weight:850;color:#a51e32}.logo small{display:block;color:#667788;font-size:10px;letter-spacing:2px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100dvh - 76px)}nav{background:#fff;padding:18px;border-right:1px solid #dfe4ea;display:grid;align-content:start;gap:8px}nav button{text-align:left;background:transparent;color:#3d4b5b}nav button.active{background:#fcebee;color:#a51e32;font-weight:700}main{padding:25px;max-width:1400px;width:100%;margin:auto}h1{font-size:26px;margin:0 0 6px}h2{font-size:17px}.muted{color:#748093}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.kpi,.panel{background:white;border:1px solid #e0e5eb;border-radius:14px;padding:18px}.kpi strong{display:block;font-size:30px}.kpi span{font-size:12px;color:#6c7a89}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.primary{background:#aa2135;color:#fff}.soft{background:#e9eef4;color:#36495b}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{background:#f0f3f6}.filters button.sel{background:#243c55;color:white}.ticket{display:grid;grid-template-columns:minmax(0,1fr) 120px 140px;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #edf0f3;cursor:pointer}.ticket:last-child{border-bottom:0}.ticket b{display:block}.ticket small{display:block;color:#6b7b8b;margin-top:4px}.pill{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}.new{background:#ffe1e5;color:#b01e33}.work{background:#fff2c9;color:#8b6000}.resolved{background:#daf5e3;color:#217545}.urg{color:#c41f32;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select{border:1px solid #cbd4de;border-radius:8px;padding:10px;background:white;width:100%}.field textarea{min-height:90px}.dialog{position:fixed;inset:0;background:#1b28365c;display:grid;place-items:center;padding:12px;z-index:9}.dialog .panel{width:min(650px,100%);max-height:92dvh;overflow:auto}.step{position:relative;padding:0 0 18px 27px;border-left:2px solid #dbe2e9;margin-left:7px}.step:before{content:'●';position:absolute;left:-8px;top:-2px;color:#a51e32}.step small{display:block;color:#68798b}.notify{position:fixed;right:15px;top:85px;max-width:340px;background:white;box-shadow:0 8px 35px #28394940;border-left:5px solid #aa2135;padding:16px;z-index:8;border-radius:10px}.bars{display:grid;gap:12px}.bar{height:12px;background:#edf0f3;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#ad293b}.foot{font-size:12px;color:#7b8795;margin-top:18px}@media(max-width:760px){.shell{display:block}nav{display:flex;overflow:auto;border:0;padding:8px;gap:4px}nav button{white-space:nowrap;font-size:12px;padding:8px}main{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.ticket{grid-template-columns:1fr 90px;gap:6px}.ticket>small{grid-column:1/-1}.notify{top:65px;right:8px;left:8px;max-width:none}}
</style></head><body><header><div class="logo">MODUS <span style="color:#29394b">TRADE CENTRE</span><small>ЕДИНЫЙ ЦЕНТР ОБРАЩЕНИЙ И ИДЕЙ</small></div><div class="row"><span id="identity" class="muted">Демо-режим</span><button class="soft" id="sound">🔕 Включить звук</button></div></header><div class="shell"><nav id="nav"></nav><main id="main"></main></div><div id="overlay"></div><script>
const menu=['Главная','Все заявки','Подать заявку','Идеи','Аналитика','База знаний'];let tab='Главная',filter='all',data=[],seen=null,sound=false,ctx=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=x=>new Date(x).toLocaleString('ru-RU');const age=x=>{let m=Math.max(0,Math.floor((Date.now()-new Date(x))/60000));return m<1?'только что':m<60?m+' мин':m<1440?Math.floor(m/60)+' ч '+m%60+' мин':Math.floor(m/1440)+' д'};const names={new:'Новая',work:'В работе',resolved:'Решена'};function nav(t){tab=t;render()}function play(){if(!sound||!ctx)return;[650,850].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),at=ctx.currentTime+i*.16;o.frequency.value=f;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.1,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.14);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+.15)})} $('sound').onclick=async()=>{if(sound){sound=false;$('sound').textContent='🔕 Включить звук';return}ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();sound=true;$('sound').textContent='🔔 Звук включён'};async function load(){try{let r=await fetch('/api/tickets',{cache:'no-store'});if(!r.ok)throw Error();let next=await r.json();if(seen){let fresh=next.filter(t=>!seen.has(t.id));if(fresh.length){play();$('overlay').innerHTML='<div class="notify"><b>🔔 Новая заявка</b><p>'+esc(fresh[0].title)+'</p><button class="primary" onclick="openTicket('+JSON.stringify(fresh[0].id).replace(/"/g,'&quot;')+')">Открыть</button><button onclick="document.getElementById(\'overlay\').innerHTML=\'\'">×</button></div>';setTimeout(()=>{if($('overlay').querySelector('.notify'))$('overlay').innerHTML=''},12000)}}seen=new Set(next.map(t=>t.id));data=next;render()}catch{}}function render(){ $('nav').innerHTML=menu.map(m=>'<button class="'+(tab===m?'active':'')+'" data-tab="'+m+'">'+m+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));let total=data.length,n=data.filter(x=>x.status==='new').length,w=data.filter(x=>x.status==='work').length,r=data.filter(x=>x.status==='resolved').length;let head='<h1>'+esc(tab)+'</h1><p class="muted">Сервисные обращения, идеи клиентов и сотрудников — в одном центре</p>';let list=data.filter(x=>(filter==='all'||x.status===filter)&&((tab!=='Идеи')||x.type==='Идея')).sort((a,b)=>new Date(b.created)-new Date(a.created));let rows=list.map(t=>'<div class="ticket" data-id="'+esc(t.id)+'"><div><b>'+(t.priority==='urgent'?'<span class="urg">! </span>':'')+esc(t.title)+'</b><small>'+esc(t.department)+' · '+esc(t.author)+' · '+age(t.created)+'</small></div><span class="pill '+t.status+'">'+names[t.status]+'</span><small>'+date(t.created)+'</small></div>').join('')||'<p class="muted">Пока нет обращений</p>';let kpis='<div class="kpis">'+[['Всего',total],['Новые',n],['В работе',w],['Решены',r]].map(x=>'<div class="kpi"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div>';let filters='<div class="filters">'+[['all','Все'],['new','Новые'],['work','В работе'],['resolved','Решены']].map(x=>'<button data-filter="'+x[0]+'" class="'+(filter===x[0]?'sel':'')+'">'+x[1]+'</button>').join('')+'</div>';let form='<div class="panel"><h2>Новое обращение или идея</h2><form id="create"><label class="field">Ваше имя<input name="author" required maxlength="80"></label><label class="field">Тип<select name="type"><option>Сервисная заявка</option><option>Идея</option><option>Поставка</option><option>Гарантия</option><option>Техническая консультация</option></select></label><label class="field">Отдел<select name="department"><option>Сервисный центр</option><option>Логистика</option><option>Продажи</option><option>ИТ и интеграции</option><option>Развитие и качество</option></select></label><label class="field">Тема<input name="title" required maxlength="140"></label><label class="field">Описание<textarea name="description" required maxlength="3000"></textarea></label><label><input type="checkbox" name="urgent"> Срочная заявка</label><p><button class="primary">Отправить заявку</button></p></form></div>';let analytics='<div class="panel"><h2>Статусы обращений</h2><div class="bars">'+[['Новые',n],['В работе',w],['Решены',r]].map(x=>'<div>'+x[0]+' · '+x[1]+'<div class="bar"><i style="width:'+(total?x[1]/total*100:0)+'%"></i></div></div>').join('')+'</div></div>';let kb='<div class="panel"><h2>База знаний</h2><p>Видеонаблюдение: проверить питание PoE, сеть и журнал регистратора.</p><p>СКУД: проверить доступность контроллера и журнал событий.</p><p>Гарантия: приложить номер заказа, модель и описание неисправности.</p><p class="muted">Материалы носят демонстрационный характер.</p></div>';let body=tab==='Подать заявку'?form:tab==='Аналитика'?kpis+analytics:tab==='База знаний'?kb:(tab==='Главная'?kpis:'')+'<div class="panel"><div class="row" style="justify-content:space-between"><h2>Реестр обращений</h2><button class="primary" id="new">+ Новая заявка</button></div>'+filters+'<div>'+rows+'</div></div>'; $('main').innerHTML=head+body+'<p class="foot">Modus Centre · демонстрационная версия · тестовые данные, не реальные обращения</p>';document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openTicket(b.dataset.id));if($('new'))$('new').onclick=()=>nav('Подать заявку');if($('create'))$('create').onsubmit=submit}
async function submit(e){e.preventDefault();let f=new FormData(e.target),body=Object.fromEntries(f);body.priority=f.has('urgent')?'urgent':'normal';delete body.urgent;let r=await fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)return alert(x.error||'Ошибка');tab='Главная';await load();openTicket(x.id)}
async function openTicket(id){let t=data.find(x=>x.id===id);if(!t)return;let hist=[{at:t.created,by:t.author,label:'Заявка получена',detail:t.description},...(t.history||[])].sort((a,b)=>new Date(a.at)-new Date(b.at));$('overlay').innerHTML='<div class="dialog"><div class="panel"><div class="row" style="justify-content:space-between"><h2>'+esc(t.title)+'</h2><button class="soft" id="close">✕</button></div><span class="pill '+t.status+'">'+names[t.status]+'</span><p>'+esc(t.description)+'</p><h2>Отслеживание заявки</h2>'+hist.map(h=>'<div class="step"><b>'+esc(h.label)+'</b><small>'+date(h.at)+' · '+esc(h.by)+'</small><p>'+esc(h.detail||'')+'</p></div>').join('')+'<form id="update"><label class="field">Ответ / результат<textarea name="detail" required></textarea></label><label class="field">Следующий этап<select name="status"><option value="work">В работе</option><option value="resolved">Решена</option><option value="new">Новая</option></select></label><label class="field">Ваше имя<input name="by" required></label><button class="primary">Добавить событие</button></form><p class="muted">Демо: роли и права доступа ещё не настроены.</p></div></div>';$('close').onclick=()=>{$('overlay').innerHTML=''};$('update').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/tickets/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok)return alert('Не удалось обновить');await load();openTicket(id)}}
load();let stream=new EventSource('/api/events');stream.addEventListener('change',load);stream.onerror=()=>{};setInterval(()=>{if(stream.readyState!==1)load()},6000);setInterval(()=>{document.querySelectorAll('[data-id]').forEach(el=>{let t=data.find(x=>x.id===el.dataset.id);if(t){let small=el.querySelector('small');if(small)small.textContent=t.department+' · '+t.author+' · '+age(t.created)}})},30000);
</script></body></html>
