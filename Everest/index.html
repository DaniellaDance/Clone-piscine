<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пик Tomorrow School — Everest</title><style>body{margin:0;font:16px system-ui;background:linear-gradient(#c6e9f8,#eef6fc);color:#163047}main{max-width:850px;margin:auto;padding:20px}h1{text-align:center}button,input{padding:12px;border-radius:9px;border:1px solid #8eaab9;font-size:16px}button{background:#14618d;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.4;cursor:not-allowed}.card{background:#ffffffde;padding:18px;border-radius:16px;margin:15px 0;box-shadow:0 3px 12px #16304720}.animals{display:flex;flex-wrap:wrap;gap:7px}.animals button{background:#f0f7fa;color:#163047}.animals button.selected{background:#217b51;color:white}.track{height:280px;position:relative;background:linear-gradient(140deg,#d5e7f4 30%,#a0b2bc 30%,#edf6fb 65%,#788b9b 65%);border-radius:12px;overflow:hidden}.climber{position:absolute;left:15%;font-size:20px;white-space:nowrap;text-shadow:0 1px white}.hour{font-size:34px;font-weight:700;text-align:center}.choices button{display:block;width:100%;text-align:left;background:#edf6ff;color:#123}small{color:#526}.bar{height:12px;background:#c8d9e4;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#2d9c6a}#message{white-space:pre-wrap}code{font-family:monospace}</style><main><div id="intro" style="position:fixed;inset:0;z-index:100;background:linear-gradient(155deg,#0d283d,#327b9d);color:white;display:grid;place-items:center;text-align:center;padding:24px"><div><div style="font-size:52px">🏔️</div><h2>Dani Flor Production</h2><p style="font-size:21px">представляет игру для студентов<br><strong>Tomorrow School (Pavlodar Campus)</strong></p><h1>Пик Tomorrow School — Everest</h1><button onclick="document.getElementById('intro').remove()" style="background:#f4d68c;color:#152a40;font-weight:bold">Продолжить</button></div></div><h1>🏔️ Пик Tomorrow School</h1><p style="text-align:center">12 квестов · 12 000 метров · 60 минут · один ход за раз</p><section class="card" id="setup"><h2>Комната восхождения</h2><button onclick="createRoom()">Создать комнату</button><p>Или войди по коду:</p><input id="roomCode" placeholder="Код комнаты" maxlength="6"><p><input id="playerName" placeholder="Твоё имя" maxlength="32"></p><h3>Выбери свободное животное</h3><div id="animals" class="animals"></div><p><button onclick="joinRoom()">Выбрать персонажа и войти</button></p></section><section class="card" id="game" hidden><h2>Комната <span id="code"></span></h2><p id="share"></p><div class="hour">⌛ <span id="clock">60:00</span></div><p id="status"></p><button id="start" onclick="startGame()" hidden>🚩 Начать игру</button><div class="track" id="track"></div><div id="players"></div><div id="question"></div><div id="message"></div></section></main><script>
const names={lion:'🦁 Лев',rabbit:'🐇 Заяц',wolf:'🐺 Волк',bear:'🐻 Медведь',fox:'🦊 Лиса',raccoon:'🦝 Енот','snow-leopard':'🐆 Снежный барс'};
let chosen='lion',code='',id='',state=null,locked=false;
const $=x=>document.getElementById(x);
function renderAnimals(){const taken=new Set(state?.players?.map(x=>x.animal)||[]);$('animals').innerHTML='';for(const [a,label] of Object.entries(names)){const b=document.createElement('button');b.textContent=label+(taken.has(a)?' · занят':'');b.disabled=taken.has(a);b.className=a===chosen?'selected':'';b.onclick=()=>{chosen=a;renderAnimals()};$('animals').append(b)}}
async function api(action,more={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code,id,...more})});const j=await r.json();if(j.error)throw Error(j.error);return j}
function error(e){$('message').textContent=e.message}
async function createRoom(){try{const r=await api('create');$('roomCode').value=r.code;code=r.code;$('message').textContent=''}catch(e){alert(e.message)}}
async function joinRoom(){try{code=$('roomCode').value.trim().toUpperCase();const r=await api('join',{code,name:$('playerName').value,animal:chosen});id=r.id;sessionStorage.setItem('everest-session',JSON.stringify({code,id}));$('setup').hidden=true;$('game').hidden=false;await refresh()}catch(e){alert(e.message)}}
async function startGame(){try{state=await api('start');render()}catch(e){error(e)}}
async function answer(choice){if(locked)return;locked=true;try{const r=await api('answer',{choice});state=r;$('message').textContent=(r.feedback?.correct?'✅ Верно! +100 м.':'🌱 Ошибка — продолжай восхождение!')+'\n'+(r.feedback?.explanation||'');render()}catch(e){error(e)}finally{locked=false}}
async function refresh(){if(!id)return;try{state=await api('state');render()}catch(e){error(e)}}
function render(){if(!state)return;$('code').textContent=code;$('share').textContent='Пригласи друзей: '+location.origin+'/?room='+code;const s=state.remaining,m=String(Math.floor(s/60)).padStart(2,'0'),sec=String(s%60).padStart(2,'0');$('clock').textContent=m+':'+sec;const me=state.players.find(x=>x.id===id);$('start').hidden=!(state.status==='lobby'&&state.host===id);$('status').textContent=state.status==='lobby'?'Ожидаем старта. Только первый выбравший животное может начать игру.':state.status==='finished'?'Восхождение завершено!': 'Сейчас отвечает: '+(state.players.find(x=>x.id===state.turn)?.name||'—');$('track').innerHTML='';for(const p of state.players){const el=document.createElement('div');el.className='climber';el.style.bottom=(8+p.altitude/12000*82)+'%';el.style.left=(10+p.position*12)+'%';el.textContent=names[p.animal].split(' ')[0]+' '+p.name+' · '+p.altitude+' м';$('track').append(el)}$('players').innerHTML='';for(const p of state.players){const d=document.createElement('p');d.textContent=names[p.animal]+' — '+p.name+' — '+p.altitude+' м'+(p.id===state.turn?' ← ход':'');$('players').append(d)}$('question').innerHTML='';if(state.status==='finished'){const ranking=[...state.players].sort((a,b)=>b.altitude-a.altitude||b.correct-a.correct);$('question').textContent='🏆 Итоги: '+ranking.map((x,i)=>(i+1)+'. '+x.name+' ('+x.altitude+' м)').join(' · ');return}if(state.status!=='playing')return;if(state.turn!==id){$('question').textContent='Ожидай своей очереди';return}if(!state.question){$('question').innerHTML='<button onclick="answer(0)">Получить следующий вопрос</button>';return}const q=state.question;const h=document.createElement('h3');h.textContent='Quest '+q.quest+' · '+q.difficulty+' · '+q.topic;$('question').append(h);const p=document.createElement('p');p.textContent=q.question_ru;$('question').append(p);const opts=document.createElement('div');opts.className='choices';q.options_ru.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(i);opts.append(b)});$('question').append(opts)}
const saved=sessionStorage.getItem('everest-session');if(saved){try{({code,id}=JSON.parse(saved));$('setup').hidden=true;$('game').hidden=false}catch(e){}}const invite=new URLSearchParams(location.search).get('room');if(invite)$('roomCode').value=invite;renderAnimals();setInterval(refresh,2000);refresh();
</script></html>
