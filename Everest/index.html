/* Everest approved poster: displayed only in the lobby */

.frame{background-image:none!important;background:linear-gradient(#80c6f0 0%,#b7e7f6 44%,#d9f0fa 45%,#5a8f9f 53%,#7ec470 54%,#2f7e49 100%)!important;min-height:500px}
.frame:before{content:"";position:absolute;inset:17% 0 32%;background:linear-gradient(135deg,transparent 35%,#eefaff 36% 45%,#718da8 46% 57%,transparent 58%) left/66% 100% no-repeat,linear-gradient(225deg,transparent 30%,#f9ffff 31% 42%,#698da9 43% 58%,transparent 59%) right/74% 100% no-repeat;pointer-events:none}
.frame .artwork-mask{display:none}.climbers{z-index:5}
.animals{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.animals button{padding:5px;background:#eef8fb;color:#12394b;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.animals button .portrait{display:block;width:100%;aspect-ratio:170/255;background-position:center;background-size:cover;border-radius:9px}
.animals button .animal-name{font-weight:800;font-size:14px}
.animals button.selected{outline:3px solid #ffd44f}
.climber{min-width:68px;max-width:21%;padding:4px;background:#ffffffed}
.climber .face{display:block;width:clamp(46px,8vw,86px);height:clamp(57px,10vw,104px);background-position:center;background-size:cover;border-radius:11px;margin:auto;border:3px solid var(--suit)}
.climber .jacket{width:38px;height:12px;margin:-6px auto 1px;background:var(--suit);border-radius:4px}
.cloud{width:min(94%,570px);max-height:72%;overflow:auto;overflow-x:hidden;overflow-wrap:anywhere;overscroll-behavior:contain}
.cloud h2,.cloud p,.cloud button{max-width:100%;overflow-wrap:anywhere;word-break:break-word}
.cloud button{white-space:normal;min-height:42px}
@media(max-width:700px){.animals{grid-template-columns:repeat(3,minmax(0,1fr))}.animals button .animal-name{font-size:12px}.frame{height:min(76dvh,720px);min-height:480px}.cloud{width:calc(100% - 16px);top:2%;max-height:68%;padding:11px 9px}.cloud p,.cloud button{font-size:clamp(12px,3.6vw,16px)}.climber{min-width:54px;max-width:28%}.climber .face{width:46px;height:58px}}

/* Actual climbing scene: photographic alpine valley, never placeholder CSS triangles */
.frame{background:linear-gradient(180deg,#00365310,#073c3025),url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1800&q=85") center center/cover no-repeat!important;min-height:560px;aspect-ratio:auto;height:min(80dvh,780px);isolation:isolate}
.frame::before,.frame::after{content:none!important}.frame .artwork-mask{display:none!important}
#game[data-lobby="true"] .frame{display:none!important}#game[data-lobby="false"]

const stories=[['Эверест — крыша мира','Эверест — высочайшая вершина Земли: 8 848,86 м. Он находится в Гималаях, на границе Непала и Китая.'],['Маттерхорн — каменная пирамида','Маттерхорн высотой 4 478 м стоит на границе Швейцарии и Италии и знаменит своей пирамидальной формой.'],['Фудзи — символ Японии','Фудзи — вулкан высотой 3 776 м. Его правильный конус и снежная вершина стали одним из символов Японии.'],['Белуха — жемчужина Алтая','Белуха — высочайшая вершина Алтая, на границе Казахстана и России. Здесь рождаются ледниковые реки.'],['Килиманджаро — снег у экватора','Килиманджаро в Танзании достигает 5 895 м. На его склонах сменяются разные природные зоны.'],['Хан-Тенгри — мраморная пирамида','Хан-Тенгри в Тянь-Шане славится остроконечной вершиной, которая на закате кажется золотой.'],['Ама-Даблам — жемчужина Гималаев','Ама-Даблам в Непале известна своими изящными ледяными гребнями.'],['Доломиты — розовые скалы','На закате светлые скалы Доломитовых Альп в Италии окрашиваются в розовые и золотистые оттенки.']];
let chosen='',outfit='',code='',id='',state=null,locked=false,lastQuestion='',musicEnabled=false,audioCtx=null,ambience=null,chirpTimer=null;

const jacketHue={fox:0,wolf:216,owl:44,bear:106,'snow-leopard':188,lynx:278,deer:106,panda:44,rabbit:335,raccoon:275,tigress:26,lion:0};
const jacketCache=new Map();
function hsv(r,g,b){r/=255;g/=255;b/=255;let max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0;if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=(h*60+360)%360}return [h,max?d/max:0,max]}
function rgb(h,s,v){let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,z=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return z.map(t=>Math.round((t+m)*255))}
function recolorPortrait(animal,color){const key=animal+'|'+color;if(jacketCache.has(key))return Promise.resolve(jacketCache.get(key));return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);const data=ctx.getImageData(0,0,canvas.width,canvas.height),p=data.data,hex=colors[color]||colors.blue;const [target,ts]=hsv(parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)),source=jacketHue[animal]??0;for(let y=Math.floor(canvas.height*.48);y<canvas.height;y++){for(let x=0;x<canvas.width;x++){const i=(y*canvas.width+x)*4;const [h,s,v]=hsv(p[i],p[i+1],p[i+2]);const difference=Math.abs(((h-source+540)%360)-180);if(difference>22||s<.32||v<.14||v>.96)continue;const strength=Math.min(1,(22-difference)/9,(s-.32)/.18,(y/canvas.height-.48)/.10);if(strength<=0)continue;const [rr,gg,bb]=rgb(target,Math.min(.96,Math.max(.48,s*.55+ts*.45)),v);p[i]=Math.round(p[i]*(1-strength)+rr*strength);p[i+1]=Math.round(p[i+1]*(1-strength)+gg*strength);p[i+2]=Math.round(p[i+2]*(1-strength)+bb*strength)}}ctx.putImageData(data,0,0);const url=canvas.toDataURL('image/jpeg',.88);jacketCache.set(key,url);resolve(url)}catch(e){resolve(portraits[animal])}};img.onerror=()=>resolve(portraits[animal]);img.src=portraits[animal]})}
function showJacket(el,animal,color){const key=animal+'|'+color;el.dataset.jacket=key;el.style.backgroundImage='url("'+portraits[animal]+'")';recolorPortrait(animal,color).then(url=>{if(el.isConnected&&el.dataset.jacket===key)el.style.backgroundImage='url("'+url+'")'})}
let lobbyPlayers=[];
function renderChoices(){const first=lobbyPlayers.length===0;$('joinTrip').textContent=first?'Начать игру':'Присоединиться к турпоходу';const taken=new Set(lobbyPlayers.map(p=>p.animal));$('animals').replaceChildren();for(const [animal,label] of Object.entries(names)){const b=document.createElement('button');const pic=document.createElement('span');pic.className='portrait';const original=portraitAliases[animal]||animal;pic.style.backgroundImage='url("'+portraits[original]+'")';const caption=document.createElement('span');caption.className='animal-name';caption.textContent=label+(taken.has(animal)?' · занят':'');const swatch=document.createElement('span');swatch.className='animal-color';swatch.textContent=characterOutfits[animal][1];swatch.style.setProperty('--character-color',colors[characterOutfits[animal][0]]);b.append(pic,caption,swatch);b.disabled=taken.has(animal);b.className=animal===chosen?'selected':'';b.onclick=()=>{chosen=animal;renderChoices()};$('animals').append(b)}}
async function api(action,more={}){const response=await fetch(location.protocol==='file:'?'https://tomorrow-school-everest.onrender.com/api':'/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code,id,...more})});const result=await response.json().catch(()=>({error:'Сервер вернул некорректный ответ'}));if(!response.ok||result.error)throw Error(result.error||'Ошибка сервера '+response.status);return result}
function notify(error){$('message').textContent=error.message||String(error)}
async function createRoom(){try{const result=await api('create');code=result.code;$('roomCode').value=code;await checkLobby()}catch(e){alert('Не удалось создать комнату: '+e.message+'\nПопробуйте ещё раз через несколько секунд.')}}
async function checkLobby(){if(id)return;const value=$('roomCode').value.trim().toUpperCase();if(!/^[A-F0-9]{6}$/.test(value))return;try{const result=await api('lobby',{code:value});lobbyPlayers=result.players||[];renderChoices()}catch(e){}}
async function joinRoom(){try{if(!chosen)throw Error('Сначала выберите животное');code=$('roomCode').value.trim().toUpperCase();const result=await api('join',{code,animal:chosen,outfitColor:'auto'});id=result.id;$('setup').hidden=true;$('game').hidden=false;await refresh();if(state?.status==='lobby'&&state?.host===id){state=await api('start');render()}}catch(e){alert(e.message)}}
async function startGame(){try{state=await api('start');render()}catch(e){notify(e)}}
async function pauseGame(){try{state=await api('pause');render()}catch(e){notify(e)}}
async function resumeGame(){try{state=await api('resume');render()}catch(e){notify(e)}}
async function answer(choice){if(locked||state?.turn!==id)return;locked=true;try{const response=await api('answer',{choice});state=response;if(response.feedback?.correct)playSuccess();$('message').textContent=response.feedback?(response.feedback.correct?'🎉 Верно! +100 метров. ':'Ответ неверный. ')+(response.feedback.explanation||''):'';render()}catch(e){notify(e)}finally{locked=false}}
async function refresh(){if(!id)return;try{state=await api('state');render()}catch(e){if(/не найден|Комната не найдена|Игрок не найден/.test(e.message)){id='';state=null;$('setup').hidden=false;$('game').hidden=true;renderChoices()}else notify(e)}}
function render(){if(!state)return;$('game').dataset.lobby=String(state.status==='lobby');$('sessionNumber').textContent=state.sessionNumber||'—';$('share').textContent='Приглашение: '+location.origin+'/?room='+code;$('pause').hidden=!(state.status==='playing'&&state.host===id);$('resume').hidden=!(state.status==='paused'&&state.host===id);$('status').textContent=state.status==='lobby'?'Выбор персонажей. Первый игрок начинает игру.':state.status==='paused'?'⏸ Пауза. Прогресс сохранён.':state.status==='finished'?'🏆 Восхождение завершено!':'Сейчас отвечает: '+(names[state.players.find(p=>p.id===state.turn)?.animal]||'—');const field=$('climbers');$('registeredRoster').hidden=true;const players=state.status==='lobby'?[]:state.players;const activeIds=new Set(players.map(p=>p.id));for(const old of [...field.children])if(!activeIds.has(old.dataset.id))old.remove();for(const p of players){const suit=colors[p.outfit_color]||colors[characterOutfits[p.animal]?.[0]]||colors.blue,rank=Number(p.position)||0;let e=[...field.children].find(el=>el.dataset.id===p.id);if(!e){e=document.createElement('div');e.dataset.id=p.id;e.dataset.altitude=String(p.altitude);e.className='climber';const hiker=document.createElement('span');hiker.className='hiker';for(const side of ['left','right']){const claw=document.createElement('span');claw.className='claw '+side;hiker.append(claw)}for(const side of ['left','right']){for(const kind of ['leg','arm']){const limb=document.createElement('span');limb.className='animal-'+kind+' '+side;hiker.append(limb)}}const meters=document.createElement('span');meters.className='meters';e.append(hiker,meters);field.append(e)}if(Number(e.dataset.altitude)!==Number(p.altitude)){e.dataset.altitude=String(p.altitude);e.classList.add('moving');clearTimeout(e._walkingStop);e._walkingStop=setTimeout(()=>e.classList.remove('moving'),1450)}e.classList.toggle('active',p.id===state.turn);e.style.setProperty('--suit',suit);e.querySelector('.hiker').style.backgroundImage='url("'+animalSprite(p.animal)+'")';e.lastElementChild.textContent=p.altitude+' м';const progress=Math.max(0,Math.min(1,p.altitude/12000));e.classList.toggle('mountain-climbing',progress>=.5);let x,y;if(progress<=.5){const t=progress*2;x=9+74*t;y=10+18*t+Math.sin(t*Math.PI*3)*3}else{const t=(progress-.5)*2;x=83-36*t;y=28+55*t}const lane=(rank-3)*2.8;x=Math.max(8,Math.min(92,x));y=Math.max(11,Math.min(90,y+lane));e.style.left=x+'%';e.style.bottom=y+'%'}
$('leaderboard').replaceChildren();for(const p of state.players){const chip=document.createElement('span');chip.textContent=names[p.animal]+' · '+p.altitude+' м';$('leaderboard').append(chip)}const own=state.status==='playing'&&state.turn===id&&!!state.question;$('cloud').hidden=!own;const storyVisible=state.status==='playing'&&state.turn!==id;$('story').hidden=!storyVisible;if(storyVisible){const key=String(state.turn)+String(state.used||0);let hash=0;for(const ch of key)hash=(hash*31+ch.charCodeAt(0))>>>0;const step=Math.floor((30-Math.max(0,state.questionRemaining??30))/10);const fact=stories[(hash+step)%stories.length];$('storyTitle').textContent=fact[0];$('storyText').textContent=fact[1]}if(!own)return;const q=state.question;const signature=q.id+':'+state.turn;if(lastQuestion!==signature){lastQuestion=signature;$('questionHeading').textContent='Quest '+q.quest+' · '+q.difficulty+' · '+q.topic;$('questionText').textContent=q.question_ru;const answers=$('answers');answers.replaceChildren();q.options_ru.forEach((option,index)=>{const b=document.createElement('button');b.textContent=option;b.onclick=()=>answer(index);answers.append(b)})}$('questionTimer').textContent='⏳ '+Math.max(0,state.questionRemaining??30)+' сек'}
function getAudio(){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return null;audioCtx=audioCtx||new Audio();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}
function playSuccess(){const c=getAudio();if(!c)return;const now=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=now+i*.10;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.27);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.28)})}
function bird(c,gain){for(let i=0;i<2;i++){const t=c.currentTime+i*.12,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(1700,t);o.frequency.exponentialRampToValueAtTime(2700,t+.07);o.frequency.exponentialRampToValueAtTime(1400,t+.15);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(gain);o.start(t);o.stop(t+.17)}}
function toggleMusic(){musicEnabled=!musicEnabled;const b=$('music');b.textContent=musicEnabled?'🔊 Music Off':'🎵 Music On';b.setAttribute('aria-pressed',String(musicEnabled));if(!musicEnabled){if(chirpTimer)clearInterval(chirpTimer);chirpTimer=null;if(ambience){ambience.source.stop();ambience.lfo.stop();ambience.gain.disconnect();ambience=null}return}const c=getAudio();if(!c)return;const buffer=c.createBuffer(1,c.sampleRate*3,c.sampleRate),samples=buffer.getChannelData(0);let last=0;for(let i=0;i<samples.length;i++){last=(last+(Math.random()*2-1)*.04)/1.0005;samples[i]=last*.7+(Math.random()*2-1)*.05}const source=c.createBufferSource();source.buffer=buffer;source.loop=true;const filter=c.createBiquadFilter();filter.type='lowpass';filter.frequency.value=460;const gain=c.createGain();gain.gain.value=.06;source.connect(filter);filter.connect(gain);gain.connect(c.destination);const lfo=c.createOscillator(),depth=c.createGain();lfo.frequency.value=.12;depth.gain.value=.035;lfo.connect(depth);depth.connect(gain.gain);source.start();lfo.start();ambience={source,lfo,gain};bird(c,gain);chirpTimer=setInterval(()=>{if(musicEnabled)bird(c,gain)},4200)}
localStorage.removeItem('everest-session');const invite=new URLSearchParams(location.search).get('room');if(invite&&!id)$('roomCode').value=invite;renderChoices();setInterval(refresh,1000);setInterval(checkLobby,3000);$('roomCode').addEventListener('input',()=>{lobbyPlayers=[];renderChoices();checkLobby()});refresh();
