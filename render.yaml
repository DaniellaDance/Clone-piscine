# Free Render web service + external Neon PostgreSQL.
# Create a Neon Free project first, then paste its PostgreSQL connection string
# into DATABASE_URL in Render. Never commit the connection string to GitHub.
services:
  - type: web
    name: coding-monopoly-tomorrow-school
    runtime: docker
    plan: free
    dockerContext: ./coding-monopoly
    dockerfilePath: ./coding-monopoly/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
