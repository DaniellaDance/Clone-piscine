databases:
  - name: coding-monopoly-db
    databaseName: monopoly
    user: monopoly
    plan: basic
services:
  - type: web
    name: coding-monopoly-tomorrow-school
    runtime: docker
    plan: starter
    dockerContext: ./coding-monopoly
    dockerfilePath: ./coding-monopoly/Dockerfile
    healthCheckPath: /health
    preDeployCommand: sh /app/init-db.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coding-monopoly-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
