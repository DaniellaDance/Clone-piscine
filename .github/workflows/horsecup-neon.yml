name: HorseCup Neon deploy
on:
  push:
    branches: [main]
    paths:
      - 'HorseCup/**'
      - '.github/workflows/horsecup-neon.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: horsecup-neon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: HorseCup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check accounts.mjs
          node --check race-engine.mjs
          node --check js/game.js
      - name: Unit tests
        run: npm test
      - name: Prepare optimized images
        run: npm run assets
      - name: Package HorseCup
        run: |
          npm prune --omit=dev
          rm -rf node_modules/sharp node_modules/@img node_modules/.cache
          echo 'Largest directories before packaging:'
          du -h -d 2 . | sort -h | tail -20
          zip -q -r -9 "$RUNNER_TEMP/horsecup-neon.zip" . -x '*.test.mjs' 'downloads/*' 'images/*' 'node_modules/sharp/*' 'node_modules/@img/*' 'node_modules/.cache/*' 'README.md' 'scripts/*' 'optimize-images.mjs' 'package-lock.json' '*.apk' '*.mp4' '*.wav' '*.ogg' '*.zip' '*.map'
          test -f "$RUNNER_TEMP/horsecup-neon.zip" || { echo 'Archive missing'; exit 1; }
          ls -lh "$RUNNER_TEMP/horsecup-neon.zip"
          test "$(stat -c%s "$RUNNER_TEMP/horsecup-neon.zip")" -lt 33554432 || { echo 'Neon ZIP exceeds 32 MiB'; exit 1; }
          unzip -t "$RUNNER_TEMP/horsecup-neon.zip" | tail -1
          unzip -l "$RUNNER_TEMP/horsecup-neon.zip" | tail -2
          python3 -c 'import zipfile,os; z=zipfile.ZipFile(os.environ["RUNNER_TEMP"]+"/horsecup-neon.zip"); n=sum(i.file_size for i in z.infolist()); print("Uncompressed size:",round(n/1048576,2),"MiB"); assert n < 50*1048576, "Uncompressed bundle exceeds 50 MiB"'
      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: horsecup-neon-${{ github.sha }}
          path: ${{ runner.temp }}/horsecup-neon.zip
          retention-days: 7
      - name: Deploy and verify on Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          HORSECUP_DATABASE_URL: ${{ secrets.HORSECUP_DATABASE_URL }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @neon/sdk
          node scripts/deploy-neon.mjs "$RUNNER_TEMP/horsecup-neon.zip"
