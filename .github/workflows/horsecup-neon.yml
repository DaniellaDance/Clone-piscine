name: HorseCup Neon deploy
on:
  push:
    branches: [main]
    paths:
      - 'HorseCup/**'
      - '.github/workflows/horsecup-neon.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: horsecup-neon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: HorseCup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check accounts.mjs
          node --check race-engine.mjs
          node --check js/game.js
      - name: Unit tests
        run: npm test
      - name: Integration tests on isolated Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/verify-neon.mjs
      - name: Prepare optimized images
        run: npm run assets
      - name: Package HorseCup
        run: |
          npm prune --omit=dev
          rm -rf node_modules/sharp node_modules/@img node_modules/.cache
          bundle="$RUNNER_TEMP/horsecup-bundle"
          mkdir -p "$bundle/images/animations"
          cp index.mjs server.mjs accounts.mjs race-engine.mjs question-bank.mjs exam-bank.mjs index.html styles.css sw.js manifest.webmanifest package.json "$bundle/"
          cp -R js icons optimized node_modules "$bundle/"
          cp images/*.webp "$bundle/images/"
          cp images/animations/*.gif "$bundle/images/animations/"
          node -e 'const fs=require("fs"),p=process.argv[1]+"/package.json",j=JSON.parse(fs.readFileSync(p));delete j.dependencies.sharp;j.scripts={start:"node server.mjs"};fs.writeFileSync(p,JSON.stringify(j))' "$bundle"
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > "$bundle/deployment.json"
          cd "$bundle"
          zip -q -r -9 "$RUNNER_TEMP/horsecup-neon.zip" .
          test "$(stat -c%s "$RUNNER_TEMP/horsecup-neon.zip")" -lt 33554432
          python3 -c 'import zipfile,os; z=zipfile.ZipFile(os.environ["RUNNER_TEMP"]+"/horsecup-neon.zip"); n=sum(i.file_size for i in z.infolist()); print("Uncompressed:",round(n/1048576,2),"MiB"); assert n<50*1048576; names=z.namelist(); assert "index.mjs" in names; assert "images/voronaya.webp" in names; assert "images/animations/black.gif" in names'
      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: horsecup-neon-${{ github.sha }}
          path: ${{ runner.temp }}/horsecup-neon.zip
          retention-days: 7
      - name: Deploy and verify on Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          HORSECUP_DATABASE_URL: ${{ secrets.HORSECUP_DATABASE_URL }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @neon/sdk
          node scripts/deploy-neon.mjs "$RUNNER_TEMP/horsecup-neon.zip"

