name: Modus Centre MVP checks
on:
  push:
    paths:
      - 'Hackathon November 2026/modus-trade-centre/**'
      - '.github/workflows/modus-centre-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hackathon November 2026/modus-trade-centre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - run: node --test mvp.test.mjs
