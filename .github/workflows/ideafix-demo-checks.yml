name: IdeaFIX demo checks
on:
  push:
    branches: [main]
    paths:
      - 'XAKATON/IdeaFIX/**'
      - '.github/workflows/ideafix-demo-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ideafix-demo-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: XAKATON/IdeaFIX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: XAKATON/IdeaFIX/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Validate IdeaFIX UI and discussion API syntax
        run: |
          node --check public/assets/app.js
          node --check public/assets/catalog-ui.js
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('public/assets/catalog-ui.js','utf8');if(!s.includes('tile.openstreetmap.org')||s.includes('L.tileLayer(')||s.includes('L.map('))throw Error('Native OSM map validation failed');if(!s.includes('openstreetmap.org/copyright'))throw Error('OSM attribution is missing');if(!s.includes('data-map-project-add'))throw Error('Project add control is missing');"
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('ai-assistant.mjs','utf8');if(!s.includes('free_mode:true'))throw Error('Free rule-based AI mode is missing');if(!s.includes('/api/ai/status'))throw Error('AI status route is missing');"
          node --check server.mjs
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('server.mjs','utf8');for(const host of ['tile.openstreetmap.org'])if(!s.includes(host))throw Error('Map CSP missing: '+host);"
          node --check public/assets/discussions.js
          node --check ai-assistant.mjs
          node --check discussions.mjs
          node --check discussions.test.mjs
      - name: Unit tests (no production database)
        run: npm run test:unit
      - name: Check demo pages
        run: |
          test -s public/index.html
          test -s public/mobile.html
          test -s public/desktop.html
          test -s public/install.html
      - name: Verify Gemini API key and available model
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/check-gemini.mjs
      - name: Package Neon deployment archive
        run: |
          npm prune --omit=dev
          printf '\n/* ideafix-commit:%s */\n' "$GITHUB_SHA" >> public/assets/voice.js
          zip -q -r "$RUNNER_TEMP/ideafix-neon.zip" . -x '*.test.mjs' 'test.mjs' 'README.md' 'CONCEPT.md' '.gitignore'
          unzip -t "$RUNNER_TEMP/ideafix-neon.zip" | tail -n 1
      - name: Save deployment archive for Neon
        uses: actions/upload-artifact@v4
        with:
          name: ideafix-neon-${{ github.sha }}
          path: ${{ runner.temp }}/ideafix-neon.zip
          retention-days: 7
          if-no-files-found: error
      - name: Deploy to Neon Functions
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL || 'gemini-2.5-flash' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @neon/sdk
          node scripts/deploy-neon.mjs "$RUNNER_TEMP/ideafix-neon.zip"
